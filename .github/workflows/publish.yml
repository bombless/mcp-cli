name: Release

# Pushing a tag like v0.1.0 builds the package, attaches an installable tarball
# to a GitHub Release, and publishes to GitHub Packages.
on:
  push:
    tags: ["v*"]

jobs:
  release-tarball:
    name: GitHub Release tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci
      - run: npm run compile

      # dist/ is committed (needed for `npm i -g` from git); fail if it drifted from src/.
      - name: Check dist is up to date
        run: git diff --exit-code -- dist

      - name: Pack tarball
        run: |
          npm pack
          # Stable, unversioned name so `releases/latest/download/mcp-cli.tgz` always works.
          cp ./*.tgz mcp-cli.tgz
          ls -l ./*.tgz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --generate-notes
          fi

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@bombless"
          cache: npm

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci
      - run: npm run compile
      - name: Check dist is up to date
        run: git diff --exit-code -- dist

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
